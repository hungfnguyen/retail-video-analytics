[project]
name = "retail-video-analytics"
version = "0.1.0"
description = "Retail Video Analytics - Monorepo"
requires-python = ">=3.12"
dependencies = ["core", "messaging", "storage"]

[tool.uv.sources]
core = { workspace = true }
messaging = { workspace = true }
storage = { workspace = true }

[tool.uv.workspace]
members = ["services/vision", "services/api", "packages/*"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8",
    "pytest-cov>=5",
    "repo2txt>=0.1.6",
    "ruff>=0.15.13",
]
