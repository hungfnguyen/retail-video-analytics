name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check services/ packages/ scripts/

      - name: Verify imports
        run: |
          uv run --package rva-vision python -c "
          from track.roboflow_tracker import create_supervision_tracker
          from config.settings import settings
          from detect.supervision_yolo_detector import SupervisionYoloDetector
          from emit.pulsar_emitter import PulsarEmitter
          from reader import VideoFileReader
          print('All imports OK')
          "

      - name: Verify packages
        run: |
          uv run python -c "
          from core import __version__ as _; pass
          from messaging import __version__ as _; pass
          from storage import __version__ as _; pass
          print('All packages OK')
          " 2>/dev/null || uv run python -c "
          import core
          import messaging
          import storage
          print('All packages OK')
          "
