[project]
name = "rva-streamlit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rva-core",
    "rva-storage",
    "streamlit>=1.32",
    "plotly>=5.18",
    "opencv-python-headless>=4.9",
    "pillow>=10.2",
    "python-dotenv>=1.0",
]

[project.scripts]
rva-dashboard = "streamlit_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_app"]

[tool.uv.sources]
rva-core    = { workspace = true }
rva-storage = { workspace = true }
