[project]
name = "rva-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rva-core",
    "rva-storage",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.scripts]
rva-api = "api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[tool.uv.sources]
rva-core    = { workspace = true }
rva-storage = { workspace = true }
