[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rva-vision"
version = "0.1.0"
description = "Retail Video Analytics - Vision AI Service"
requires-python = ">=3.12"
dependencies = [
    "core",
    "messaging",
    "storage",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "torch==2.4.1+cu124",
    "torchvision==0.19.1+cu124",
    "ultralytics>=8.2",
    "supervision>=0.28",
    "trackers>=0.1",
    "deep-sort-realtime>=1.3",
    "lap>=0.5.12",
    "torchreid==0.2.5",
    "python-dotenv>=1.0.0",
    "pulsar-client[avro]==3.5.0",
    "boto3>=1.34",
    "gdown",
]

[tool.uv.sources]
core = { workspace = true }
messaging = { workspace = true }
storage = { workspace = true }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["."]
