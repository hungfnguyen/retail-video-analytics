# Docker Compose — Development Mode (MinIO local, no AWS S3)
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# Differences from production docker-compose.yml:
#   - MinIO enabled (local S3-compatible storage)
#   - Iceberg REST depends on MinIO
#   - All S3 config points to MinIO (minio:9000, path_style=true)
#   - No AWS credentials needed

services:
  pulsar-broker:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-broker
    command: ["/bin/bash", "-c", "bin/pulsar standalone"]
    ports:
      - "6650:6650"
      - "8084:8080"
    volumes:
      - ./infrastructure/pulsar/conf/standalone.conf:/pulsar/conf/standalone.conf
      - ./infrastructure/pulsar/conf/client.conf:/pulsar/conf/client.conf
      - ./infrastructure/pulsar/scripts:/pulsar/scripts
      - ./infrastructure/pulsar/schema:/pulsar/schema
      - pulsar_data:/pulsar/data
      - ./logs/pulsar:/pulsar/logs
    environment:
      PULSAR_MEM: "-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 60s
    networks:
      - retail-net

  pulsar-init:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-init
    depends_on:
      pulsar-broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/pulsar/scripts/init-topics.sh"]
    volumes:
      - ./infrastructure/pulsar/scripts:/pulsar/scripts
      - ./infrastructure/pulsar/schema:/pulsar/schema
      - ./infrastructure/pulsar/conf/client.conf:/pulsar/conf/client.conf
    environment:
      PULSAR_MEM: "-Xms256m -Xmx256m -XX:MaxDirectMemorySize=256m"
    restart: "no"
    networks:
      - retail-net

  flink-jobmanager:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - flink_state:/opt/flink/state
      - ./services/flink-jobs/sql:/opt/flink/usrlib/sql
      - ./logs/flink:/opt/flink/log
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
      LOG4J_CONFIGURATION_FILE: /opt/flink/conf/log4j2.properties
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - retail-net

  flink-taskmanager:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - flink_state:/opt/flink/state
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
      LOG4J_CONFIGURATION_FILE: /opt/flink/conf/log4j2.properties
    networks:
      - retail-net

  flink-job-submitter:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-job-submitter
    command: /opt/flink/bin/submit-jobs.sh
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      iceberg-rest:
        condition: service_healthy
      pulsar-broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
    networks:
      - retail-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - retail-net

  # === MinIO — local S3-compatible storage ===
  minio:
    build: ./infrastructure/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - retail-net

  mc:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ALIAS: local
      MINIO_SERVER_URL: http://minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    entrypoint: ["/bin/sh","-lc","trap : TERM INT; while :; do sleep 3600; done"]
    volumes:
      - mc_config:/root/.mc
      - ./infrastructure/minio/scripts:/scripts:ro
    networks:
      - retail-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_SERVER_URL: http://minio:9000
      ICEBERG_WAREHOUSE: s3a://warehouse
      MINIO_ADDITIONAL_BUCKETS: ${MINIO_ADDITIONAL_BUCKETS:-}
      MINIO_MC_ALIAS: local
    volumes:
      - mc_config:/root/.mc
      - ./infrastructure/minio/scripts/init.sh:/scripts/init.sh:ro
    restart: "no"
    networks:
      - retail-net

  iceberg-rest:
    image: tabulario/iceberg-rest:0.7.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      CATALOG_WAREHOUSE: s3a://warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin123
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - retail-net

  trino:
    image: trinodb/trino:418
    container_name: trino
    ports:
      - "8083:8080"
    volumes:
      - ./infrastructure/trino/etc:/etc/trino
      - trino_data:/data/trino
      - ./logs/trino:/data/trino/var/log
    environment:
      ICEBERG_WAREHOUSE: s3a://warehouse
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
    depends_on:
      iceberg-rest:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - retail-net

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: trino-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: trino-datasource
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
      - ./logs/grafana:/var/log/grafana
    depends_on:
      - trino
    restart: unless-stopped
    networks:
      - retail-net

volumes:
  trino_data:
    driver: local
  flink_state:
    driver: local
  pulsar_data:
    driver: local
  minio_data:
    driver: local
  mc_config:
    driver: local
  grafana_data:
    driver: local

networks:
  retail-net:
    driver: bridge
