services:
  pulsar-broker:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-broker
    command: ["/bin/bash", "-c", "bin/pulsar standalone"]
    ports:
      - "6650:6650"      # Pulsar broker (binary protocol)
      - "8084:8080"      # Pulsar admin API (mapped to host:8084 to avoid conflict)
    volumes:
      - ./infrastructure/pulsar/conf/standalone.conf:/pulsar/conf/standalone.conf
      - ./infrastructure/pulsar/conf/client.conf:/pulsar/conf/client.conf
      - ./infrastructure/pulsar/scripts:/pulsar/scripts
      - ./infrastructure/pulsar/schema:/pulsar/schema
      - pulsar_data:/pulsar/data
      - ./logs/pulsar:/pulsar/logs
    environment:
      PULSAR_MEM: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 60s
    networks:
      - retail-net

  pulsar-init:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-init
    depends_on:
      pulsar-broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/pulsar/scripts/init-topics.sh"]
    volumes:
      - ./infrastructure/pulsar/scripts:/pulsar/scripts
      - ./infrastructure/pulsar/schema:/pulsar/schema
      - ./infrastructure/pulsar/conf/client.conf:/pulsar/conf/client.conf
    environment:
      PULSAR_MEM: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g"
    restart: "no"
    networks:
      - retail-net

  flink-jobmanager:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - flink_state:/opt/flink/state
      - ./services/flink-jobs/sql:/opt/flink/usrlib/sql
      - ./logs/flink:/opt/flink/log
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_REST_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
      LOG4J_CONFIGURATION_FILE: /opt/flink/conf/log4j2.properties

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - retail-net
  flink-taskmanager:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - flink_state:/opt/flink/state
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_REST_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
      LOG4J_CONFIGURATION_FILE: /opt/flink/conf/log4j2.properties

    networks:
      - retail-net

  # Service tự động submit jobs khi Flink cluster sẵn sàng
  flink-job-submitter:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-job-submitter
    command: /opt/flink/bin/submit-jobs.sh
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      iceberg-rest:
        condition: service_healthy
      pulsar-broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_REST_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
    networks:
      - retail-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - retail-net

  iceberg-rest:
    image: tabulario/iceberg-rest:0.7.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT}
      CATALOG_S3_ACCESS__KEY__ID: ${S3_ACCESS_KEY}
      CATALOG_S3_SECRET__ACCESS__KEY: ${S3_SECRET_KEY}
      CATALOG_S3_PATH__STYLE__ACCESS: "${S3_PATH_STYLE}"
      CATALOG_S3_REGION: ${S3_REGION}
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - retail-net

  trino:
    image: trinodb/trino:418
    container_name: trino
    ports:
      - "8083:8080"
    volumes:
      - ./infrastructure/trino/etc:/etc/trino
      - trino_data:/data/trino
    environment:
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      iceberg-rest:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - retail-net
  
volumes:
  trino_data:
    driver: local
  flink_state:
    driver: local
  pulsar_data:
    driver: local

networks:
  retail-net:
    driver: bridge
