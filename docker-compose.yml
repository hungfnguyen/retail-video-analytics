services:
  pulsar-broker:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-broker
    command: ["/bin/bash", "-c", "bin/pulsar standalone"]
    ports:
      - "6650:6650"      # Pulsar broker (binary protocol)
      - "8084:8080"      # Pulsar admin API (mapped to host:8084 to avoid conflict)
    volumes:
      - ./infrastructure/pulsar/conf/standalone.conf:/pulsar/conf/standalone.conf
      - ./infrastructure/pulsar/conf/client.conf:/pulsar/conf/client.conf
      - ./infrastructure/pulsar/scripts:/pulsar/scripts
      - ./infrastructure/pulsar/schema:/pulsar/schema
      - pulsar_data:/pulsar/data
      - ./logs/pulsar:/pulsar/logs
    environment:
      PULSAR_MEM: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/brokers/health"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 60s
    networks:
      - retail-net

  pulsar-init:
    image: apachepulsar/pulsar:3.3.2
    container_name: pulsar-init
    depends_on:
      pulsar-broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/pulsar/scripts/init-topics.sh"]
    volumes:
      - ./infrastructure/pulsar/scripts:/pulsar/scripts
      - ./infrastructure/pulsar/schema:/pulsar/schema
      - ./infrastructure/pulsar/conf/client.conf:/pulsar/conf/client.conf
    environment:
      PULSAR_MEM: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g"
    restart: "no"
    networks:
      - retail-net

  flink-jobmanager:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-jobmanager
    command: /opt/flink/bin/bootstrap-flink.sh jobmanager
    ports:
      - "8081:8081"
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - flink_state:/opt/flink/state
      - ./runtime/flink:/opt/flink/runtime
      - ./services/flink-jobs/sql:/opt/flink/usrlib/sql
      - ./logs/flink:/opt/flink/log
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_REST_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      FLINK_CHECKPOINTS_URI: ${FLINK_CHECKPOINTS_URI:-s3://retail-video-analytics-prod/flink/checkpoints}
      FLINK_SAVEPOINTS_URI: ${FLINK_SAVEPOINTS_URI:-s3://retail-video-analytics-prod/flink/savepoints}
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
      LOG4J_CONFIGURATION_FILE: /opt/flink/conf/log4j2.properties

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - retail-net
  flink-taskmanager:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-taskmanager
    command: /opt/flink/bin/bootstrap-flink.sh taskmanager
    depends_on:
      - flink-jobmanager
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - flink_state:/opt/flink/state
      - ./runtime/flink:/opt/flink/runtime
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_REST_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      FLINK_CHECKPOINTS_URI: ${FLINK_CHECKPOINTS_URI:-s3://retail-video-analytics-prod/flink/checkpoints}
      FLINK_SAVEPOINTS_URI: ${FLINK_SAVEPOINTS_URI:-s3://retail-video-analytics-prod/flink/savepoints}
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
      LOG4J_CONFIGURATION_FILE: /opt/flink/conf/log4j2.properties

    networks:
      - retail-net

  # Service tự động submit jobs khi Flink cluster sẵn sàng
  flink-job-submitter:
    build:
      context: .
      dockerfile: infrastructure/flink/Dockerfile
    container_name: flink-job-submitter
    command: /opt/flink/bin/bootstrap-flink.sh submitter
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
      iceberg-rest:
        condition: service_healthy
      pulsar-broker:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_REST_URI: ${ICEBERG_CATALOG_URI}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      FLINK_CHECKPOINTS_URI: ${FLINK_CHECKPOINTS_URI:-s3://retail-video-analytics-prod/flink/checkpoints}
      FLINK_SAVEPOINTS_URI: ${FLINK_SAVEPOINTS_URI:-s3://retail-video-analytics-prod/flink/savepoints}
      FLINK_JOB_REGISTRY: /opt/flink/runtime/job-registry.tsv
      FLINK_SAVEPOINT_MANIFEST: /opt/flink/runtime/restore-manifest.tsv
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PULSAR_DLQ_TOPIC: persistent://retail/metadata/dlq-events
    volumes:
      - ./infrastructure/flink/conf:/opt/flink/conf
      - ./runtime/flink:/opt/flink/runtime
    networks:
      - retail-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - retail-net

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # consumed by the init script to provision two isolated databases
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      ICEBERG_DB_NAME: ${ICEBERG_DB_NAME}
      ICEBERG_DB_USER: ${ICEBERG_DB_USER}
      ICEBERG_DB_PASSWORD: ${ICEBERG_DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - retail-net

  iceberg-rest:
    image: tabulario/iceberg-rest:0.7.0
    container_name: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      AWS_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      # Durable JDBC catalog on Postgres (replaces the ephemeral in-memory SQLite
      # default that wiped all table metadata on every restart).
      CATALOG_URI: jdbc:postgresql://postgres:5432/${ICEBERG_DB_NAME}
      CATALOG_JDBC_USER: ${ICEBERG_DB_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_DB_PASSWORD}
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT}
      CATALOG_S3_ACCESS__KEY__ID: ${S3_ACCESS_KEY}
      CATALOG_S3_SECRET__ACCESS__KEY: ${S3_SECRET_KEY}
      CATALOG_S3_PATH__STYLE__ACCESS: "${S3_PATH_STYLE}"
      CATALOG_S3_REGION: ${S3_REGION}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - retail-net

  trino:
    image: trinodb/trino:418
    container_name: trino
    ports:
      - "8083:8080"
    volumes:
      - ./infrastructure/trino/etc:/etc/trino
      - trino_data:/data/trino
    environment:
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PATH_STYLE: ${S3_PATH_STYLE}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      iceberg-rest:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - retail-net

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: api
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TRINO_URL: "http://trino:8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LIVE_MEDIA_TRANSPORT: ${LIVE_MEDIA_TRANSPORT:-file}
      LIVE_MEDIA_REDIS_PREFIX: ${LIVE_MEDIA_REDIS_PREFIX:-live:frame}
      LIVE_MEDIA_TTL_SEC: ${LIVE_MEDIA_TTL_SEC:-10}
      RVA_CAMERA_CONFIG: /app/configs/cameras.yaml
      RVA_LIVE_MEDIA_DIR: /app/runtime/live_frames
      RVA_LOGS_DIR: /app/logs
      PULSAR_SERVICE_URL: pulsar://pulsar-broker:6650
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-false}
    volumes:
      - ./runtime:/app/runtime
      - ./logs:/app/logs
      - ./configs:/app/configs:ro
    depends_on:
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - retail-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - retail-net

  airflow:
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    container_name: airflow
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - >
        rm -f /opt/airflow/airflow-webserver.pid
        /opt/airflow/airflow-scheduler.pid
        /opt/airflow/airflow-triggerer.pid
        && exec airflow standalone
    ports:
      - "8085:8080"      # Airflow webserver (host:8085 to avoid conflicts)
    volumes:
      - ./infrastructure/airflow/dags:/opt/airflow/dags
      - .:/opt/retail-video-analytics:ro   # repo mount so DAGs can run services/gold_serving/*.py
      - airflow_data:/opt/airflow
    environment:
      # Orchestration glue only — Airflow shells out to the repo's runner scripts.
      TRINO_URL: "http://trino:8080"
      TRINO_USER: "rva_gold_serving"
      TRINO_CATALOG: "lakehouse"
      TRINO_SCHEMA: "rva_gold_serving"
      FLINK_REST_URL: "http://flink-jobmanager:8081"
      FLINK_BATCH_JAR_PATH: "/opt/rva-artifacts/gold-jobs.jar"
      RVA_PROJECT_ROOT: "/opt/retail-video-analytics"
      RVA_PYTHON_BIN: "python3"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Durable metadata DB on Postgres (replaces the standalone SQLite backend),
      # which also unlocks parallel task execution via LocalExecutor.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres:5432/${AIRFLOW_DB_NAME}"
      AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
      # Give gunicorn more time to start on resource-constrained EC2 instances
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__WEBSERVER__WORKERS: "2"
    depends_on:
      trino:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - retail-net

volumes:
  trino_data:
    driver: local
  flink_state:
    driver: local
  pulsar_data:
    driver: local
  redis_data:
    driver: local
  airflow_data:
    driver: local
  pg_data:
    driver: local

networks:
  retail-net:
    driver: bridge
