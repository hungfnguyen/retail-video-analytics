# Pulsar standalone overrides for retail-video-analytics

clusterName=standalone

# Đơn giản: broker advertise bằng container name, mọi client trong Docker network dùng pulsar://pulsar-broker:6650
# IMPORTANT: Set advertisedAddress to localhost so external clients (like Python script on host) can connect
advertisedAddress=localhost
advertisedListeners=external:pulsar://localhost:6650,internal:pulsar://pulsar-broker:6650
internalListenerName=internal
bindAddress=0.0.0.0

managedLedgerDefaultEnsembleSize=1
managedLedgerDefaultWriteQuorum=1
managedLedgerDefaultAckQuorum=1

brokerDeleteInactiveTopicsEnabled=false
allowAutoTopicCreation=true
allowAutoTopicCreationType=partitioned

transactionCoordinatorEnabled=true

# Topic Policies Configuration - required for producer timeout fix
systemTopicEnabled=true
topicLevelPoliciesEnabled=true

functionsWorkerEnabled=true
functionWorkerThreadPoolSize=8

# Tiered storage (configure GCS credentials via env before enabling)
# managedLedgerOffloadDriver=google-cloud-storage
# gcsManagedLedgerOffloadBucket=pulsar-tiered
# gcsManagedLedgerOffloadRegion=us-central1
