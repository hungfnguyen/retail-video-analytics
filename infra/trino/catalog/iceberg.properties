# Iceberg catalog — reads lakehouse data from GCS via Iceberg REST
connector.name=iceberg

# Iceberg REST service endpoint
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}/iceberg

# GCS credentials (Trino uses hive.gcs.* properties for GCS access)
hive.gcs.json-key-file-path=${ENV:GOOGLE_APPLICATION_CREDENTIALS}
hive.gcs.use-access-token=false
