global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "flink"
    static_configs:
      - targets: ["flink-jobmanager:9249"]
    metrics_path: /metrics

  - job_name: "pulsar"
    static_configs:
      - targets: ["pulsar:8080"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
