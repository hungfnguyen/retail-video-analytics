cameras:
  - camera_id: cam_01
    name: "Entrance Camera"
    rtsp_url: "rtsp://admin:password@192.168.1.101:554/stream1"
    store_id: store_001
    location: "Main entrance"
    fps: 25
    resolution: "1920x1080"
    enabled: true

  - camera_id: cam_02
    name: "Checkout Area"
    rtsp_url: "rtsp://admin:password@192.168.1.102:554/stream1"
    store_id: store_001
    location: "Checkout counter"
    fps: 25
    resolution: "1920x1080"
    enabled: true

  - camera_id: cam_03
    name: "Aisle Camera"
    rtsp_url: "rtsp://admin:password@192.168.1.103:554/stream1"
    store_id: store_001
    location: "Main aisle"
    fps: 20
    resolution: "1920x1080"
    enabled: false

settings:
  reconnect_delay_initial: 1      # seconds
  reconnect_delay_max: 30         # seconds
  health_check_interval: 10       # seconds
  frame_queue_size: 2             # frames
  gcs_upload_interval: 1          # seconds
