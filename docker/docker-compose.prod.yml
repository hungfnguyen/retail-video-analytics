version: "3.9"

# Production overrides: resource limits and restart policies
services:
  vision:
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  streamlit:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    restart: always

  postgres:
    restart: always

  pulsar:
    restart: always
