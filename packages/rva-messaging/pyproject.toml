[project]
name = "rva-messaging"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rva-core",
    "pulsar-client[avro]>=3.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rva_messaging"]

[tool.uv.sources]
rva-core = { workspace = true }
