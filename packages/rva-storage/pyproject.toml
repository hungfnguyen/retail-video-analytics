[project]
name = "rva-storage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "rva-core",
    "google-cloud-storage>=2.14",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rva_storage"]

[tool.uv.sources]
rva-core = { workspace = true }
