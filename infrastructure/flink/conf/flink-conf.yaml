# ==========================================
# Flink Cluster Configuration (Fixed for S3)
# ==========================================

# -- JobManager & TaskManager Network --
jobmanager.rpc.address: flink-jobmanager
jobmanager.rpc.port: 6123
jobmanager.bind-host: 0.0.0.0
jobmanager.memory.process.size: 800m

taskmanager.bind-host: 0.0.0.0
taskmanager.memory.process.size: 2048m
# 16 slots (was 8): the always-on streaming layer is ~8 jobs and fully occupied
# all 8 slots, leaving none for the sequential Gold-serving batch chain — batch
# steps then timed out on slot.request.timeout (e.g. zone_hourly). Slots are
# scheduling units only; idle slots cost no RAM, and batch data volume is tiny,
# so this adds headroom without raising the 2048m TM process size.
taskmanager.numberOfTaskSlots: 16

# -- REST Interface (Web UI) --
rest.address: flink-jobmanager
rest.port: 8081
rest.bind-address: 0.0.0.0

# -- Parallelism & Timeouts --
parallelism.default: 1
slot.request.timeout: 120000

# Disable batch Adaptive Batch Scheduler auto-parallelism. Streaming commits a
# small file every 30s, so Iceberg batch sources inferred huge parallelism
# (p=40/25 for ~4 rows), and the multi-join executive_daily job then exhausted
# network buffers ("Insufficient number of network buffers"). Data volume is
# tiny, so forcing parallelism.default=1 for batch is correct, costs no RAM, and
# is far faster than scheduling dozens of empty subtasks. (Streaming jobs are
# unaffected — adaptive batch parallelism applies only to BATCH execution mode.)
execution.batch.adaptive.auto-parallelism.enabled: false

# Iceberg has its OWN source-parallelism inference, independent of the adaptive
# batch scheduler above: it sets the scan operator's parallelism to the split
# count (capped at 100). Streaming jobs commit a tiny file every 30s, so a fact
# table like gold_queue_sessions accumulates ~100 small files → the batch
# serving scan was inferred at parallelism=100 on a 16-slot cluster and failed.
# Disabling inference makes batch scans honour parallelism.default=1, which is
# correct for our tiny per-day windows and removes the scheduling blow-up.
table.exec.iceberg.infer-source-parallelism: false

# -- Blob & Query Server --
blob.server.port: 6124
query.server.port: 6125

# Force TIMESTAMP_LTZ -> DATE/HOUR casts and CURRENT_DATE in Flink SQL to use
# Vietnam business time instead of the container's default UTC zone.
table.local-time-zone: Asia/Ho_Chi_Minh

# -- CHECKPOINT & STATE BACKEND --
# Giá trị thực được render từ env bởi bootstrap-flink.sh vào runtime conf dir.
state.backend.type: filesystem
state.checkpoints.dir: __FLINK_CHECKPOINTS_URI__
state.savepoints.dir: __FLINK_SAVEPOINTS_URI__
fs.allowed-fallback-filesystems: s3a

# Cấu hình S3 cho Flink System (Checkpointing)
# AWS S3 mode: endpoint is auto-resolved by AWS SDK

# -- Execution Checkpointing --
# Bắt buộc bật để Iceberg Sink có thể commit data
# 30s cho near real-time analytics (trade-off giữa latency vs small files)
execution.checkpointing.interval: 30s
execution.checkpointing.min-pause: 15s
execution.checkpointing.timeout: 1200s
execution.checkpointing.tolerable-failed-checkpoints: 5
execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

# -- Java Options (Fix Java 17+ Access Issues) --
# Cho phép truy cập module java.util để Kryo serializer hoạt động
env.java.opts: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
env.java.opts.jobmanager: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
env.java.opts.taskmanager: "--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
